{% extends 'base.html' %}

{% block title %}Login — Metro Rush{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-slate-900/90 border border-cyan-500/30 rounded-3xl p-6 sm:p-8 backdrop-blur-xl shadow-2xl shadow-cyan-950/50">
    <div class="text-center mb-6">
        <span class="text-4xl">🚇</span>
        <h1 class="font-arcade text-2xl font-black text-cyan-400 mt-2">RUNNER LOGIN</h1>
        <p class="text-slate-400 text-sm mt-1">Sign in to save high scores, unlock characters, and compete globally.</p>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username</label>
            <input type="text" name="username" required autofocus class="w-full bg-slate-950 border border-cyan-500/40 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all" placeholder="Enter your runner tag">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-950 border border-cyan-500/40 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all" placeholder="••••••••">
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl font-arcade font-bold text-slate-950 bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-500 hover:from-cyan-300 hover:to-blue-400 shadow-lg shadow-cyan-500/30 active:scale-[0.99] transition-all">
            ENTER METRO
        </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800 flex flex-col items-center space-y-3">
        <a href="{% url 'game:index' %}" class="text-sm text-cyan-400 hover:text-cyan-300 hover:underline">
            ⚡ Continue as Guest Runner
        </a>
        <p class="text-xs text-slate-400">
            Don't have an account? 
            <a href="{% url 'accounts:register' %}" class="text-pink-400 hover:text-pink-300 font-bold hover:underline">Sign Up Now</a>
        </p>
    </div>
</div>
{% endblock %}
